name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-format:
    name: lint and format
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: imagick
          coverage: none
          tools: composer

      - name: install php dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: check mago formatting
        run: vendor/bin/mago fmt --check

      - name: run mago lint
        if: success() || failure()
        run: vendor/bin/mago lint

  static-analysis:
    name: static analysis and tests (PHP ${{ matrix.php }}, Kirby ${{ matrix.kirby }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        kirby: ["5", "6"]

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: imagick
          coverage: none
          tools: composer

      # ImageMagick on the runner has no librsvg, and its own SVG renderer adds an edge pixel to
      # shapes, so the measured SVG bounds would be off by one. ImageMagick uses Inkscape if installed
      - name: install inkscape
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends inkscape

      - name: install php dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # The lock file pins Kirby 5, the lowest supported version
      - name: install kirby 6
        if: matrix.kirby == '6'
        run: composer require --dev "getkirby/cms:^6.0" --with-all-dependencies --no-interaction --no-progress

      - name: run mago analyze
        run: vendor/bin/mago --php-version=${{ matrix.php }} analyze

      - name: run tests
        if: success() || failure()
        run: php tests/run.php
